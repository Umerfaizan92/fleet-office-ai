name: Consolidated development checks

on:
  push:
    branches: [consolidated-improvements-2026, architecture-reset-step1-20261024]
  pull_request:
    branches: [main, consolidated-improvements-2026]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/db.js
          node --check saas/app.js
          node --check saas/workspace-extras.js
      - name: Validate release structure
        run: npm run validate:final
      - name: Verify release manifest
        run: npm run verify:manifest
      - name: Integration tests
        run: npm run integration:test
      - name: Runtime smoke test
        run: npm run smoke:test
      - name: Architectural reset conflict guards
        run: node --test scripts/architecture-contract.test.mjs
      - name: Security contract regression tests
        run: node --test scripts/security-contract.test.mjs
      - name: Runtime tenant and allocation regression tests
        run: node --test scripts/runtime-security.test.mjs
      - name: Voice cancellation and skill regression tests
        run: node --test scripts/voice-runtime.test.mjs
      - name: Business selection and memory isolation tests
        run: node --test scripts/workspace-context.test.mjs
