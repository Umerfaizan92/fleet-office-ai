name: Super Pro validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Work order and finance permission contract
        run: node --test scripts/workorder-rbac-contract.test.mjs

      - name: Runtime work order authorisation across seven roles
        run: node scripts/workorder-runtime-auth.test.mjs

      - name: SaaS branding and multi-organisation runtime contract
        run: node scripts/saas-branding-organisations.test.mjs

      - name: Branding edit and logo upload runtime permissions
        run: node scripts/branding-update-logo.test.mjs

      - name: Final validation
        run: npm run validate:final

      - name: Independent quality checker
        run: npm run quality:check

      - name: Integration runtime tests
        run: npm run integration:test

      - name: Runtime smoke test
        run: npm run smoke:test
