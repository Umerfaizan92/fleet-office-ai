name: Super Pro validation
on:
  pull_request:
    branches:
      - super-pro-v15-live-test
  push:
    branches:
      - super-pro-v15-cleanup
      - super-pro-v15-live-test
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Final validation
        run: npm run validate:final
      - name: Independent quality checker
        run: npm run quality:check
