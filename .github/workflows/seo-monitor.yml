name: Non-invasive SEO and availability monitor
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Audit public endpoints (read-only)
        env:
          SITE_URL: ${{ vars.SEO_SITE_URL }}
          FALLBACK_URL: https://super-pro-ai-office-manager.onrender.com
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, datetime, re
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          base=(os.environ.get('SITE_URL') or os.environ['FALLBACK_URL']).rstrip('/')
          paths=['/','/robots.txt','/sitemap.xml']
          class Tags(HTMLParser):
              def __init__(self):
                  super().__init__(); self.title=''; self.in_title=False; self.description=''; self.canonical=''; self.h1=0
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='title': self.in_title=True
                  if tag=='h1': self.h1+=1
                  if tag=='meta' and a.get('name','').lower()=='description': self.description=a.get('content','')
                  if tag=='link' and a.get('rel','').lower()=='canonical': self.canonical=a.get('href','')
              def handle_endtag(self,tag):
                  if tag=='title': self.in_title=False
              def handle_data(self,data):
                  if self.in_title: self.title+=data
          results=[]
          for path in paths:
              url=urljoin(base+'/',path.lstrip('/'))
              item={'url':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'SiteHealthMonitor/1.0 (read-only)'})
                  with urllib.request.urlopen(req,timeout=18) as response:
                      body=response.read(1024*1024).decode('utf-8','replace')
                      item.update(status=response.status,content_type=response.headers.get('Content-Type',''),bytes_sampled=len(body))
                      if path=='/':
                          t=Tags(); t.feed(body)
                          item.update(title=t.title.strip(),meta_description_present=bool(t.description.strip()),canonical=t.canonical,h1_count=t.h1)
                      if path=='/sitemap.xml':
                          item['url_entries']=len(re.findall(r'<loc>',body))
              except Exception as exc:
                  item['error']=str(exc)[:250]
              results.append(item)
          os.makedirs('seo-monitor-report',exist_ok=True)
          report={'timestamp_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'base_url':base,'checks':results,'note':'Read-only public checks. No application code, content, database, or deployment changes.'}
          with open('seo-monitor-report/report.json','w') as f: json.dump(report,f,indent=2)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Weekly read-only SEO monitor\n\n')
              for x in results:
                  f.write('- '+x['url']+': '+str(x.get('status',x.get('error','unknown')))+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Save monitoring report
        uses: actions/upload-artifact@v4
        with:
          name: seo-monitor-report
          path: seo-monitor-report/report.json
          retention-days: 30
