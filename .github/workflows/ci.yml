name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          INSTALL_LITESTREAM: '1' # checksum-verified backup tool, so the restore drill test runs in CI
      - name: Secret scan
        run: npm run security:secrets
      # scripts/verify-all.mjs: syntax, migrations, storage fallback, permission matrix, end-to-end pipeline, contract tests, final validation, quality gate
      - name: Verify everything
        run: npm test
      - name: Install browser for interface regression tests
        run: npx playwright install --with-deps chromium
      - name: Test responsive interface and portal navigation
        run: npm run test:ui
      - name: Integration runtime tests
        run: npm run integration:test
      - name: Runtime smoke test
        run: npm run smoke:test
      - name: Dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

  recovered-release-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Source and handover consistency
        run: |
          npm run verify:manifest
          npm run memory:validate
          npm run check:site
          npm run release:audit
      - name: Verify recovered public website and phase interfaces
        run: |
          npm run test:site-ui
          npm run test:pipeline-ui
          npm run test:console-ui
          npm run test:automations-ui
          npm run test:seo-ui
          npm run test:comms-ui
          npm run test:finance-ui
          npm run test:reliability-ui
          npm run verify:modules
