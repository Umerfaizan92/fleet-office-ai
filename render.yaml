services:
  - type: web
    name: super-pro-ai-office-manager
    runtime: node
    region: singapore
    # Persistent SQLite requires a paid web-service plan.
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci && npm run validate:final && npm run quality:check && npm run smoke:test
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: off
    disk:
      name: super-pro-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: NODE_VERSION
        value: "22.22.0"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_PATH
        value: "/var/data/super-pro.sqlite"
      - key: UPLOAD_DIR
        value: "/var/data/uploads"
      - key: MAX_FILE_MB
        value: "25"
      - key: MAX_FILES
        value: "10"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: SAAS_SESSION_SECRET
        generateValue: true
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_DAYS
        value: "365"
      - key: AI_TOOL_SHARED_SECRET
        generateValue: true
      - key: SAAS_VERIFICATION_TEST_MODE
        value: "0"
      - key: SAAS_VERIFY_FROM
        sync: false
      - key: TRIAL_DAYS
        value: "14"
      - key: POST_TRIAL_RESTRICT_DAYS
        value: "30"
      - key: ARCHIVE_RETENTION_DAYS
        value: "365"
      - key: FINAL_RESTORE_WINDOW_DAYS
        value: "14"
      - key: ABR_GUID
        sync: false
      - key: TELNYX_VERIFY_PROFILE_ID
        sync: false
      - key: FREE_AI_MODE
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash"
      - key: GEMINI_STT_MODEL
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_TTS_MODEL
        value: "gemini-2.5-flash-preview-tts"
      - key: GEMINI_TTS_AUTO_VOICE
        value: "Kore"
      - key: GEMINI_TTS_MALE_VOICE
        value: "Puck"
      - key: GEMINI_TTS_FEMALE_VOICE
        value: "Aoede"
      - key: AI_PROVIDER_BASE_URL
        sync: false
      - key: AI_PROVIDER_API_KEY
        sync: false
