name: Consolidated development checks

on:
  push:
    branches: [consolidated-improvements-2026]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/db.js
          node --check saas/app.js
          node --check saas/workspace-extras.js
      - name: Validate release structure
        run: npm run validate:final
      - name: Verify historical release manifest (main only)
        if: github.ref == 'refs/heads/main'
        run: npm run verify:manifest
      - name: Explain historical release manifest in development
        if: github.ref != 'refs/heads/main'
        run: echo 'SHA256SUMS_FINAL.txt records an earlier release; development changes require a new release manifest before deployment.'
      - name: Integration tests
        run: npm run integration:test
      - name: Runtime smoke test
        run: npm run smoke:test
      - name: Security contract regression tests
        run: node --test scripts/security-contract.test.mjs
      - name: Runtime tenant and allocation regression tests
        run: node --test scripts/runtime-security.test.mjs
